
name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recolor graph and remove background
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("profile-3d-contrib/profile-night-green.svg")
          if not path.exists():
              raise SystemExit(f"SVG not found: {path}")

          svg = path.read_text()

          # Remove a full-canvas white or black background rectangle.
          svg = re.sub(
              r'<rect\b(?=[^>]*\bfill=["\'](?:#fff(?:fff)?|white|#000(?:000)?|black)["\'])[^>]*/>',
              '',
              svg,
              flags=re.IGNORECASE
          )

          palette = ["#BDA98A", "#D6C5A5", "#E8D8C4", "#F5EBDD"]

          def recolor(match):
              color = match.group(0)
              value = color[1:]
              r = int(value[0:2], 16)
              g = int(value[2:4], 16)
              b = int(value[4:6], 16)

              # Detect green-dominant colors, including darker greens.
              if g > r * 1.08 and g > b * 1.05:
                  brightness = (r + g + b) / 3
                  index = min(3, int(brightness / 64))
                  return palette[index]

              return color

          svg = re.sub(r"#[0-9a-fA-F]{6}", recolor, svg)

          # Remove common inline background declarations.
          svg = re.sub(
              r'background-color:\s*(?:#000(?:000)?|black|#fff(?:fff)?|white)\s*;?',
              'background-color: transparent;',
              svg,
              flags=re.IGNORECASE
          )

          path.write_text(svg)
          print("Graph recoloring completed.")
          PY

      - name: Commit graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fix contribution graph colors"


name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recolor contribution blocks cream
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("profile-3d-contrib/profile-night-green.svg")
          if not path.exists():
              raise SystemExit("Generated SVG was not found.")

          svg = path.read_text()
          palette = ["#BDA98A", "#D6C5A5", "#E8D8C4", "#F5EBDD"]

          def recolor(match):
              color = match.group(0)
              value = color[1:]
              r, g, b = int(value[0:2], 16), int(value[2:4], 16), int(value[4:6], 16)

              if g > r * 1.08 and g > b * 1.05:
                  brightness = (r + g + b) / 3
                  return palette[min(3, int(brightness / 64))]
              return color

          svg = re.sub(r"#[0-9a-fA-F]{6}", recolor, svg)
          path.write_text(svg)
          PY

      - name: Commit graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update cream contribution graph"

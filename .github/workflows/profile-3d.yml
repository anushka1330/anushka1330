
name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recolor contribution blocks cream
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("profile-3d-contrib/profile-night-green.svg")
          if not path.exists():
              raise SystemExit("Generated SVG was not found.")

          svg = path.read_text()

          colors = {
              "#0e4429": "#BDA98A",
              "#006d32": "#D6C5A5",
              "#26a641": "#E8D8C4",
              "#39d353": "#F5EBDD",
              "#216e39": "#BDA98A",
              "#30a14e": "#D6C5A5",
              "#40c463": "#E8D8C4",
              "#9be9a8": "#F5EBDD",
              "#238636": "#BDA98A",
              "#2ea043": "#D6C5A5",
              "#3fb950": "#E8D8C4",
              "#56d364": "#F5EBDD",
              "#008000": "#E8D8C4",
              "#00ff00": "#F5EBDD",
          }

          for old, new in colors.items():
              svg = re.sub(re.escape(old), new, svg, flags=re.IGNORECASE)

          path.write_text(svg)
          print("Recolored known green shades to cream.")

          remaining_green = re.findall(
              r"#[0-9a-fA-F]{6}", svg
          )
          print("SVG updated. Check the generated file if green remains.")
          PY

      - name: Commit graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update cream contribution graph"

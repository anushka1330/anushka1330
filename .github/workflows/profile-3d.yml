
name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make background transparent and blocks cream
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("profile-3d-contrib/profile-night-green.svg")
          if not path.exists():
              raise SystemExit(f"SVG not found: {path}")

          svg = path.read_text()

          # Remove the full-size background rectangle.
          svg = re.sub(
              r'<rect\b(?=[^>]*\bx="0"[^>]*\by="0"[^>]*\bwidth="1280"[^>]*\bheight="850"[^>]*>.*?</rect>',
              '',
              svg,
              count=1,
              flags=re.IGNORECASE | re.DOTALL
          )

          # Convert RGB and hex green shades to cream.
          palette = ["#BDA98A", "#D6C5A5", "#E8D8C4", "#F5EBDD"]

          def recolor_rgb(match):
              r, g, b = map(int, match.groups())
              if g > r * 1.08 and g > b * 1.05:
                  brightness = (r + g + b) / 3
                  return palette[min(3, int(brightness / 64))]
              return match.group(0)

          svg = re.sub(
              r'rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)',
              recolor_rgb,
              svg,
              flags=re.IGNORECASE
          )

          def recolor_hex(match):
              color = match.group(0)
              value = color[1:]
              r, g, b = int(value[0:2], 16), int(value[2:4], 16), int(value[4:6], 16)
              if g > r * 1.08 and g > b * 1.05:
                  brightness = (r + g + b) / 3
                  return palette[min(3, int(brightness / 64))]
              return color

          svg = re.sub(r"#[0-9a-fA-F]{6}", recolor_hex, svg)

          path.write_text(svg)
          print("Background removal and cream recoloring completed.")
          PY

      - name: Commit graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Make contribution graph cream and transparent"

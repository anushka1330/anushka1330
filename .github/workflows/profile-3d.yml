
name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make background transparent and blocks cream
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("profile-3d-contrib/profile-night-green.svg")

          if not path.exists():
              raise SystemExit(f"SVG not found: {path}")

          svg = path.read_text(encoding="utf-8")

          # Remove the full-size background rectangle.
          root = ET.fromstring(svg)
          ns = "{http://www.w3.org/2000/svg}"

          for element in list(root):
              if element.tag == ns + "rect":
                  width = element.get("width")
                  height = element.get("height")
                  x = element.get("x", "0")
                  y = element.get("y", "0")

                  if x == "0" and y == "0" and width == "1280" and height == "850":
                      root.remove(element)
                      break

          svg = ET.tostring(root, encoding="unicode")

          palette = [
              "#BDA98A",
              "#D6C5A5",
              "#E8D8C4",
              "#F5EBDD",
          ]

          def cream(r, g, b):
              brightness = (r + g + b) / 3
              index = min(3, int(brightness / 64))
              return palette[index]

          def replace_rgb(match):
              r, g, b = map(int, match.groups())

              if g > r * 1.08 and g > b * 1.05:
                  return cream(r, g, b)

              return match.group(0)

          svg = re.sub(
              r"rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)",
              replace_rgb,
              svg,
              flags=re.IGNORECASE,
          )

          def replace_hex(match):
              color = match.group(0)
              value = color[1:]

              r = int(value[0:2], 16)
              g = int(value[2:4], 16)
              b = int(value[4:6], 16)

              if g > r * 1.08 and g > b * 1.05:
                  return cream(r, g, b)

              return color

          svg = re.sub(
              r"#[0-9a-fA-F]{6}",
              replace_hex,
              svg,
          )

          path.write_text(svg, encoding="utf-8")
          print("SVG background and cream colors updated successfully.")
          PY

      - name: Commit updated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update transparent cream contribution graph"

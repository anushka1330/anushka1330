- name: Make contribution blocks cream and background transparent run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("profile-3d-contrib/profile-night-green.svg")
          svg = path.read_text()

          # Remove the SVG's solid background rectangle, if present.
          svg = re.sub(
              r'<rect\b(?=[^>]*\bfill=["\'](?:#fff(?:fff)?|white|#f[0-9a-f]{5})["\'])[^>]*/?>',
              '',
              svg,
              flags=re.IGNORECASE
          )

          # Change green contribution-block colors to cream shades.
          green_to_cream = {
              "#0e4429": "#BDA98A",
              "#006d32": "#D6C5A5",
              "#26a641": "#E8D8C4",
              "#39d353": "#F5EBDD",
              "#216e39": "#BDA98A",
              "#30a14e": "#D6C5A5",
              "#40c463": "#E8D8C4",
              "#9be9a8": "#F5EBDD",
          }

          for green, cream in green_to_cream.items():
              svg = re.sub(green, cream, svg, flags=re.IGNORECASE)

          path.write_text(svg)
          print("Changed contribution colors to cream and removed a matching background rectangle.")
          PY
